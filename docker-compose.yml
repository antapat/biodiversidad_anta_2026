services:
  biodiversidad-anta:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-patanta}/biodiversidad_anta_2026:latest
    container_name: biodiversidad-anta
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3838}:3838"
    environment:
      BIODIVERSIDAD_DATA_MODE: ${BIODIVERSIDAD_DATA_MODE:-local}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL:-}
      BIODIVERSIDAD_ALLOW_LOCAL_FALLBACK: "false"
      SHINY_LOG_STDOUT: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3838/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
